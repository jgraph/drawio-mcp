name: Check Plugin Skill Sync

on:
  push:
    branches: [main]
    paths:
      - "plugins/claude-code/skills/drawio/**"
      - "plugins/codex/drawio/skills/drawio/**"
      - "plugins/copilot/skills/drawio/**"
      - "plugins/cursor/skills/drawio/**"
      - "plugins/antigravity/skills/drawio/**"
  pull_request:
    paths:
      - "plugins/claude-code/skills/drawio/**"
      - "plugins/codex/drawio/skills/drawio/**"
      - "plugins/copilot/skills/drawio/**"
      - "plugins/cursor/skills/drawio/**"
      - "plugins/antigravity/skills/drawio/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify port skill folders are byte-identical to the Claude Code copy
        run: |
          claude="plugins/claude-code/skills/drawio"
          status=0

          for port in \
            "plugins/codex/drawio/skills/drawio" \
            "plugins/copilot/skills/drawio" \
            "plugins/cursor/skills/drawio" \
            "plugins/antigravity/skills/drawio"; do

            if [ ! -d "$port" ]; then
              echo "$port does not exist (port not present) — nothing to check."
              continue
            fi

            if diff -r "$claude" "$port" > /dev/null; then
              echo "OK: $port is byte-identical to $claude."
            else
              echo "::error file=$port::Must be byte-identical to $claude (SKILL.md and scripts/) — mirror the edit to every copy."
              diff -ru "$claude" "$port" || true
              status=1
            fi
          done

          exit $status

      - name: Keep the skill body under Antigravity's 24,000-byte load limit
        run: |
          skill="plugins/claude-code/skills/drawio/SKILL.md"
          body=$(awk 'f>=2 {print} /^---$/ {f++}' "$skill" | wc -c)
          echo "SKILL.md body: $body bytes"
          if [ "$body" -ge 24000 ]; then
            echo "::error file=$skill::The body is $body bytes; Antigravity loads only the first 24,000. Trim it."
            exit 1
          fi

      - name: Check the bundled scripts parse
        run: |
          for script in plugins/claude-code/skills/drawio/scripts/*.js; do
            node --check "$script"
          done

      - name: Keep the front matter valid YAML for strict parsers
        run: |
          # Claude Code forgives a value YAML can't parse (an unquoted ": " in the
          # description); Copilot CLI and other strict parsers drop the skill.
          ruby -ryaml - plugins/claude-code/skills/drawio/SKILL.md <<'RUBY'
          skill = ARGV[0]
          fm = File.read(skill, encoding: "UTF-8")[/\A---\n(.*?)\n---\n/m, 1] or abort "::error file=#{skill}::No front matter."
          begin
            data = YAML.safe_load(fm)
          rescue Psych::SyntaxError => e
            abort "::error file=#{skill},line=#{e.line + 1}::The front matter is not valid YAML (#{e.problem}). Quote a value that contains \": \"."
          end
          %w[name description].each do |key|
            abort "::error file=#{skill}::The front matter needs a string #{key}." unless data.is_a?(Hash) && data[key].is_a?(String)
          end
          len = data["description"].length
          abort "::error file=#{skill}::The description is #{len} characters; skill hosts accept at most 1,024." if len > 1024
          puts "Front matter OK; description #{len} characters."
          RUBY
