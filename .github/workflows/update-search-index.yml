name: Update Shape Search Index

# The generator reads the released app.min.js from app.diagrams.net, so a
# daily run picks up every release and opens a PR only when the shapes changed.
# (drawio-dev's trigger-mcp-index-update.yml never fires: its diagramly-* tags
# are pushed with the default GITHUB_TOKEN, which starts no workflows.)
on:
  schedule:
    - cron: "17 5 * * *"
  repository_dispatch:
    types: [drawio-release]
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd shape-search && npm ci

      - name: Generate search index
        run: cd shape-search && npm run generate

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet shape-search/search-index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update shape search index"
          branch: update-search-index
          title: "chore: update shape search index"
          body: |
            Auto-generated from the draw.io release on app.diagrams.net.

            Triggered by: `${{ github.event_name }}` ${{ github.event.client_payload.tag && format('(tag: {0})', github.event.client_payload.tag) || '' }}
          delete-branch: true
